  .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:750;font-size:11px;color:#52697b;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5e0e5;background:#fff;border-radius:8px;padding:10px 11px;color:var(--ink);outline:none;min-height:40px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#57ada5;box-shadow:0 0 0 3px #daf3ee}.field textarea{min-height:77px;resize:vertical}.field.span2{grid-column:1/-1}.fieldset{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.fieldset h3{font-size:14px;margin:0 0 14px}.linegrid{display:grid;grid-template-columns:2fr .8fr .7fr .8fr .8fr;gap:9px;align-items:end}.linegrid .field input{font-size:12px}.miniinfo{color:var(--muted);font-size:11px;margin:8px 0 0}.formactions{border-top:1px solid var(--line);margin-top:20px;padding-top:18px;display:flex;gap:8px;flex-wrap:wrap}

<script>
(function(){
 'use strict';
 var routes=[

 ];
 var state={
  route:'dashboard',
  salesOrder:{customer:'Coastal Studio LLP',number:'SO-2026-001',date:'2026-09-28',delivery:'2026-10-05',reference:'CS-PO-104',item:'Website design package',qty:1,rate:50000,discount:0,hsn:'998314',tax:18,status:'Draft'},
  invoice:{customer:'Coastal Studio LLP',gstin:'37AABCC1234D1Z5',number:'INV-2026-001',date:'2026-09-28',due:'2026-10-13',place:'Andhra Pradesh',taxMode:'intra',item:'Website design package',hsn:'998314',qty:1,rate:50000,discount:0,tax:18,notes:'Thank you for your business.',status:'Draft',source:''},
  purchaseOrder:{vendor:'Pixel Works Pvt Ltd',number:'PO-2026-001',date:'2026-09-28',delivery:'2026-10-04',item:'Design support',qty:1,rate:12000,discount:0,hsn:'998314',tax:18,status:'Draft'},
  bill:{vendor:'Pixel Works Pvt Ltd',vendorInvoice:'PW-119',date:'2026-09-28',due:'2026-10-12',item:'Design support',qty:1,rate:12000,discount:0,hsn:'998314',tax:18,status:'Draft',source:''},
  receipt:0,paid:0,activity:[{title:'Prototype opened',detail:'Explore the sample order to cash and purchase to payment flows.'}],

 };
 var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
 var fmt=function(v){return '₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})};
 var calc=function(o){var base=Math.max(0,Number(o.qty||0)*Number(o.rate||0)-Number(o.discount||0));var tax=base*Number(o.tax||0)/100;return {base:base,tax:tax,total:base+tax}};
 var head=function(k,title,sub,buttons){return '<div class="pagehead"><div><p class="eyebrow">'+esc(k)+'</p><h1>'+esc(title)+'</h1><p class="sub">'+esc(sub)+'</p></div><div class="headbuttons">'+(buttons||'')+'</div></div>'};
 var b=function(label,action,cls){return '<button type="button" class="btn '+(cls||'')+'" data-action="'+esc(action)+'">'+esc(label)+'</button>'};
 var field=function(label,model,key,type,options,span){var id=model+'-'+key,val=state[model][key],control='';if(type==='select'){control='<select id="'+id+'" data-model="'+model+'" data-field="'+key+'">'+options.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>'}else if(type==='textarea'){control='<textarea id="'+id+'" data-model="'+model+'" data-field="'+key+'">'+esc(val)+'</textarea>'}else{control='<input id="'+id+'" type="'+esc(type||'text')+'" value="'+esc(val)+'" data-model="'+model+'" data-field="'+key+'"'+(type==='number'?' min="0" step="0.01"':'')+'>'}return '<div class="field '+(span?'span2':'')+'"><label for="'+id+'">'+esc(label)+'</label>'+control+'</div>'};
 var lineFields=function(model){return '<div class="linegrid">'+field('Item or service',model,'item','text')+field('HSN / SAC',model,'hsn','text')+field('Qty',model,'qty','number')+field('Rate (₹)',model,'rate','number')+field('Discount (₹)',model,'discount','number')+'</div>'};
 var summary=function(model,taxMode){var o=state[model],c=calc(o);return '<div class="mini-list"><div><span>Taxable value</span><b>'+fmt(c.base)+'</b></div><div><span>'+(taxMode==='inter'?'IGST':'GST')+' '+esc(o.tax)+'%</span><b>'+fmt(c.tax)+'</b></div><div><span>Document total</span><b>'+fmt(c.total)+'</b></div></div>'};
 var preview=function(model,title,partyLabel,party,taxMode){var o=state[model],c=calc(o),isInv=model==='invoice',isBill=model==='bill';var credit=isInv?state.receipt:(isBill?state.paid:0);return '<aside class="panel preview"><div class="previewtop"><small>Live preview</small><h2>'+esc(title)+'</h2><span class="kicker">Sample layout for developer review</span></div><div class="previewbody"><div class="docbrand">YBS <span style="color:#0b897f">Books</span></div><div class="docmeta"><div>'+esc(partyLabel)+'<b>'+esc(party)+'</b></div><div>Document no.<b>'+esc(o.number||o.vendorInvoice||'Draft')+'</b></div></div><div class="docline"><div><b>'+esc(o.item)+'</b><br><span class="muted">Qty '+esc(o.qty)+' · '+esc(o.hsn)+'</span></div><b>'+fmt(c.base)+'</b></div><div style="margin-top:14px"><div class="totrow"><span>Taxable amount</span><strong>'+fmt(c.base)+'</strong></div>'+(taxMode==='intra'?'<div class="totrow"><span>CGST '+esc(o.tax/2)+'%</span><strong>'+fmt(c.tax/2)+'</strong></div><div class="totrow"><span>SGST '+esc(o.tax/2)+'%</span><strong>'+fmt(c.tax/2)+'</strong></div>':'<div class="totrow"><span>'+(taxMode==='inter'?'IGST':'Estimated GST')+' '+esc(o.tax)+'%</span><strong>'+fmt(c.tax)+'</strong></div>')+'<div class="totrow grand"><span>Total</span><span>'+fmt(c.total)+'</span></div>'+(isInv||isBill?'<div class="totrow"><span>'+(isInv?'Received':'Paid')+'</span><strong>'+fmt(credit)+'</strong></div><div class="totrow"><span>Balance</span><strong>'+fmt(Math.max(0,c.total-credit))+'</strong></div>':'')+'</div></div><div class="previewbottom">Preview only. Final PDF, numbering, taxes and accounting entries require production rules and review.</div></aside>'};
 function nav(){var h='',last='';routes.forEach(function(r){if(r.group!==last){h+='<div class="navgroup"><div class="navlabel">'+r.group+'</div>';last=r.group}h+='<button class="navbtn '+(r.id===state.route?'active':'')+'" type="button" data-nav="'+r.id+'"><span class="navico">'+r.icon+'</span>'+r.name+'</button>';if(routes[routes.indexOf(r)+1]&&routes[routes.indexOf(r)+1].group!==r.group)h+='</div>'});h+='</div>';var mobile='<div class="mobilehead">'+routes.map(function(r){return '<button class="navbtn '+(r.id===state.route?'active':'')+'" data-nav="'+r.id+'">'+r.name+'</button>'}).join('')+'</div>';document.getElementById('nav').innerHTML=h+mobile;document.getElementById('crumb').textContent=routes.filter(function(r){return r.id===state.route})[0].name}
 function dashboard(){var inv=calc(state.invoice),bill=calc(state.bill),invoiceDue=state.invoice.status==='Draft'?0:Math.max(0,inv.total-state.receipt),billDue=state.bill.status==='Draft'?0:Math.max(0,bill.total-state.paid);return head('PRODUCT WALKTHROUGH','Your books, in one flow','A compact preview of the YBS Books add-on for Indian businesses.',b('Create invoice','go-invoice')+b('View requirements','go-settings','secondary'))+
 '<div class="notice"><strong>Interactive prototype.</strong> All names, identifiers, amounts and documents are sample data. Changes reset when the page reloads.</div>'+

ption>Cash account</option></select></div><div class="field"><label>Payment date</label><input type="date" value="2026-09-28"></div><div class="field"><label>Reference number</label><input value="UTR-DEMO-002"></div></div><div class="formactions">'+b('Record vendor payment','record-payment')+'</div></div></div><div class="panel panelpad section"><div class="panelhead"><div><h2>Posting concept</h2><p>Developer flow only · Production postings need accounting review</p></div></div><div class="grid two"><div class="mini-list"><div><span>Issue invoice</span><b>Dr receivable · Cr revenue + output GST</b></div><div><span>Collect receipt</span><b>Dr bank · Cr receivable</b></div></div><div class="mini-list"><div><span>Approve vendor bill</span><b>Dr expense + input GST · Cr payable</b></div><div><span>Pay vendor</span><b>Dr payable · Cr bank</b></div></div></div></div>'}

 function settingsPage(){return head('ADMIN','Settings & access','Decide what each customer organisation can use and who can issue financial documents.',b('Reset demo','reset-demo','secondary'))+'<div class="grid two"><div class="panel panelpad"><div class="panelhead"><div><h2>Module switches</h2><p>Per tenant configuration</p></div></div>'+[['salesOrders','Sales orders','Core workflow'],['purchaseOrders','Purchase orders','Core workflow'],['inventory','Stock tracking','Phase 1'],['eInvoice','IRP e-invoice integration','Phase 2']].map(function(a){return '<label class="checkline"><input type="checkbox" data-setting="'+a[0]+'"'+(state.settings[a[0]]?' checked':'')+'><span><strong>'+a[1]+'</strong><small style="display:block;color:#7890a0">'+a[2]+'</small></span></label>'}).join('')+'</div><div class="panel panelpad"><div class="panelhead"><div><h2>Organisation profile</h2><p>Illustrative configuration</p></div></div><div class="mini-list"><div><span>Business</span><b>Demo organisation</b></div><div><span>Financial year</span><b>2026–27</b></div><div><span>Base currency</span><b>INR</b></div><div><span>Branch state</span><b>Andhra Pradesh</b></div><div><span>Number series</span><b>INV-2026-001</b></div></div></div></div><div class="panel panelpad section"><div class="panelhead"><div><h2>Roles and issue control</h2><p>Illustrative permission matrix</p></div></div><div class="tablewrap"><table class="list"><thead><tr><th>Role</th><th>Create drafts</th><th>Approve / issue</th><th>Record payments</th><th>Close period</th></tr></thead><tbody><tr><td><strong>Owner / accountant</strong></td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr><tr><td><strong>Sales / purchaser</strong></td><td>Scoped</td><td>No</td><td>No</td><td>No</td></tr><tr><td><strong>Auditor</strong></td><td>No</td><td>No</td><td>No</td><td>Read only</td></tr></tbody></table></div><div class="notice section">Production needs tenant isolation, atomic numbering, immutable issue history, period locking, backups and reviewed accounting rules. See the accompanying requirements document for the full specification.</div></div>'}
 function render(){nav();var r=state.route,html=r==='dashboard'?dashboard():r==='contacts'?contactsPage():r==='items'?itemsPage():r==='sales-order'?orderPage('salesOrder',true):r==='invoice'?invoicePage():r==='purchase-order'?orderPage('purchaseOrder',false):r==='bill'?billPage():r==='payments'?paymentPage():r==='reports'?reportsPage():settingsPage();document.getElementById('main').innerHTML=html}
 function message(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(function(){t.classList.remove('show')},3300)}
 function activity(title,detail){state.activity.unshift({title:title,detail:detail})}
 function go(r){state.route=r;location.hash=r;render();window.scrollTo(0,0)}
 function updateTotals(){var r=state.route;if(r==='invoice'){document.getElementById('invoice-summary').innerHTML=summary('invoice',state.invoice.taxMode);document.getElementById('invoice-preview').innerHTML=preview('invoice','Tax invoice','Bill to',state.invoice.customer,state.invoice.taxMode)}else if(r==='bill'){document.getElementById('bill-summary').innerHTML=summary('bill');document.getElementById('bill-preview').innerHTML=preview('bill','Vendor bill','Vendor',state.bill.vendor,'estimate')}else if(r==='sales-order'||r==='purchase-order'){var m=r==='sales-order'?'salesOrder':'purchaseOrder';document.getElementById('order-summary').innerHTML=summary(m);var panel=document.querySelector('.preview');panel.outerHTML=preview(m,r==='sales-order'?'Sales order':'Purchase order',r==='sales-order'?'Customer':'Vendor',state[m][r==='sales-order'?'customer':'vendor'],'estimate')}}
 function action(a){
  if(a.indexOf('go-')===0){go(a.slice(3));return}
  if(a==='save-salesOrder'||a==='save-purchaseOrder'||a==='save-invoice'||a==='save-bill'){message('Draft saved in this prototype session.');activity('Draft saved',a.slice(5)+' updated');return}
  if(a==='open-salesOrder'||a==='open-purchaseOrder'){var m=a.slice(5);state[m].status='Open';activity('Order opened',state[m].number);render();message('Order marked open.');return}
  if(a==='convert-salesOrder'){state.salesOrder.status='Open';var so=state.salesOrder,iv=state.invoice;['customer','item','qty','rate','discount','hsn','tax'].forEach(function(k){iv[k]=so[k]});iv.source=so.number;iv.status='Draft';activity('Sales order converted',so.number+' → '+iv.number);go('invoice');message('Sales order copied to an invoice draft.');return}
  if(a==='convert-purchaseOrder'){state.purchaseOrder.status='Open';var po=state.purchaseOrder,bi=state.bill;['vendor','item','qty','rate','discount','hsn','tax'].forEach(function(k){bi[k]=po[k]});bi.source=po.number;bi.status='Draft';activity('Purchase order converted',po.number+' → vendor bill');go('bill');message('Purchase order copied to a bill draft.');return}
  if(a==='issue-invoice'){if(!state.invoice.customer||!state.invoice.number||!state.invoice.item||Number(state.invoice.qty)<=0){message('Complete customer, number, item and positive quantity.');return}state.invoice.status=state.receipt>=calc(state.invoice).total?'Paid':state.receipt>0?'Partially paid':'Issued';if(state.invoice.source)state.salesOrder.status='Invoiced';activity('Invoice issued',state.invoice.number+' · '+fmt(calc(state.invoice).total));render();message('Invoice issued in demo state.');return}
  if(a==='approve-bill'){if(!state.bill.vendor||!state.bill.vendorInvoice||!state.bill.item||Number(state.bill.qty)<=0){message('Complete vendor, number, item and positive quantity.');return}state.bill.status=state.paid>=calc(state.bill).total?'Paid':state.paid>0?'Partially paid':'Approved';if(state.bill.source)state.purchaseOrder.status='Billed';activity('Vendor bill approved',state.bill.vendorInvoice+' · '+fmt(calc(state.bill).total));render();message('Bill approved in demo state.');return}
  if(a==='receipt-invoice'){go('payments');document.getElementById('receiptAmount').focus();return}
  if(a==='payment-bill'){go('payments');document.getElementById('paymentAmount').focus();return}
  if(a==='record-receipt'||a==='record-payment'){var receipt=a==='record-receipt',doc=receipt?state.invoice:state.bill,amount=Number(document.getElementById(receipt?'receiptAmount':'paymentAmount').value),previous=receipt?state.receipt:state.paid,remaining=calc(doc).total-previous;if(doc.status==='Draft'){message('Issue the invoice or approve the bill first.');return}if(!Number.isFinite(amount)||amount<=0||amount>remaining+.001){message('Enter a positive amount within the outstanding balance.');return}if(receipt){state.receipt+=amount;doc.status=state.receipt>=calc(doc).total-.001?'Paid':'Partially paid'}else{state.paid+=amount;doc.status=state.paid>=calc(doc).total-.001?'Paid':'Partially paid'}activity(receipt?'Receipt recorded':'Vendor payment recorded',fmt(amount)+' allocated to '+(receipt?doc.number:doc.vendorInvoice));render();message('Payment allocated. Outstanding balance updated.');return}
  if(a==='new-customer'||a==='new-item'){message('This screen is a flow preview. Full create forms are specified in the Word requirements.');return}
  if(a==='reset-demo'){location.reload();return}
 }
 document.addEventListener('click',function(e){var n=e.target.closest('[data-nav]');if(n){go(n.getAttribute('data-nav'));return}var x=e.target.closest('[data-action]');if(x)action(x.getAttribute('data-action'))});
 document.addEventListener('input',function(e){var x=e.target;if(x.dataset.model&&x.dataset.field){var m=x.dataset.model,k=x.dataset.field;state[m][k]=x.type==='number'?Number(x.value):x.value;if(['qty','rate','discount','tax','item','customer','vendor','number','vendorInvoice','hsn','taxMode'].indexOf(k)!==-1)updateTotals()}});
 document.addEventListener('change',function(e){var x=e.target;if(x.dataset.model&&x.dataset.field){state[x.dataset.model][x.dataset.field]=x.value;updateTotals()}if(x.dataset.setting){state.settings[x.dataset.setting]=x.checked;message('Module preference changed for this demo session.')}});
 window.addEventListener('hashchange',function(){var id=location.hash.slice(1);if(routes.some(function(r){return r.id===id})&&id!==state.route){state.route=id;render()}});

})();

function activityPanel(){return panel('A little progress, every day',`<div class="activity">${state.activity.slice(0,3).map(a=>`<div class="activity-row"><span class="activity-dot">${icon(a.icon)}</span><div><p><strong>${esc(a.title)}</strong></p><small>${esc(a.detail)}</small></div><time>${esc(a.time)}</time></div>`).join('')}</div>`,'','Your latest workspace updates');}
function deadlinePanel(){return panel('Coming up next',`<div class="deadline-list"><div class="deadline"><span class="calendar-box"><small>OCT</small><strong>28</strong></span><div><b>Brand review</b><p>Your first design direction</p></div><span>3 days</span></div><div class="deadline"><span class="calendar-box"><small>OCT</small><strong>30</strong></span><div><b>Registration milestone</b><p>Incorporation filing review</p></div><span>5 days</span></div><div class="deadline"><span class="calendar-box"><small>OCT</small><strong>31</strong></span><div><b>Accounting check-in</b><p>Review pending documents</p></div><span>6 days</span></div></div><div class="calendar-note">${icon('calendar')}Illustrative dates · Confirm actual deadlines with your team.</div>`);}
function actionPanel(){return panel('A few things need you',`<div class="task-list"><div class="action-item"><span class="task-check">${icon('doc')}</span><div><b>Share your business details</b><p>Company registration</p>${pill('Action required','gold')}</div><button data-action="upload" aria-label="Add a document">↗</button></div><div class="action-item"><span class="task-check">${icon('design')}</span><div><b>Review your brand direction</b><p>First concept is ready</p>${pill('Ready to review')}</div><button data-action="project" data-id="YBS-1041" aria-label="Review brand project">↗</button></div></div>`, '<button data-action="route" data-page="documents">View all →</button>');}
function booksPromo(){const granted=state.access[0].scope!=='off';return `<section class="books-promo"><div class="eyebrow">A CLEARER FINANCIAL PICTURE</div><h3>Your next chapter.<br>With clearer books.</h3><p>Invoices, payments, and your numbers in one place.</p><button data-action="${granted?'open-books':'books-info'}">${granted?'Open YBS Books':'About Books access'} ${icon('arrow')}</button><div class="mini-book"><small>YBS</small>Books ↗</div></section>`;}
function chart(){const yearly=state.chartPeriod==='year';return `<div class="chart"><svg viewBox="0 0 560 145" preserveAspectRatio="none" role="img" aria-label="Illustrative revenue trend for ${yearly?'the year':'the month'}"><defs><linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#abbc91" stop-opacity=".25"/><stop offset="1" stop-color="#abbc91" stop-opacity="0"/></linearGradient></defs><path class="chart-grid" d="M0 20H560M0 55H560M0 90H560M0 125H560"/><path class="chart-fill" d="${yearly?'M0 113 C45 120 55 75 105 89 S175 93 210 65 S285 85 320 43 S410 65 445 26 S520 40 560 10':'M0 108 C35 112 50 83 95 93 S150 120 195 75 S240 92 285 58 S335 88 385 41 S450 70 480 35 S530 45 560 13'} V145H0Z"/><path class="chart-line" d="${yearly?'M0 113 C45 120 55 75 105 89 S175 93 210 65 S285 85 320 43 S410 65 445 26 S520 40 560 10':'M0 108 C35 112 50 83 95 93 S150 120 195 75 S240 92 285 58 S335 88 385 41 S450 70 480 35 S530 45 560 13'}"/></svg><div class="chart-labels">${(yearly?['JAN','MAR','MAY','JUL','SEP','DEC']:['01 OCT','05 OCT','10 OCT','15 OCT','20 OCT','25 OCT']).map(x=>`<span>${x}</span>`).join('')}</div></div>`;}
function clientDashboard(){const orders=activeClientOrders();return head('A good day to move forward.','Here’s what’s happening with your business today.',`<span class="date-button">${icon('calendar')}25 October 2026</span>${btn('+ New service','new-service')}`)+`<div class="welcome-banner"><div><div class="eyebrow">YOUR AMBITION. OUR EXPERTISE.</div><h2>Good morning, Arjun. Let’s build <em>what’s next.</em></h2><p>Your projects are moving. Your team is on it. Here’s your business at a glance.</p></div><div class="banner-art" aria-hidden="true"><div class="banner-orbit"></div></div><button class="banner-link" data-action="route" data-page="projects">See your projects ${icon('arrow')}</button></div><div class="kpis">${kpi('Active projects',orders.filter(o=>o.status!=='Done').length.toString().padStart(2,'0'),'Moving things forward','brief','In motion')}${kpi('Next actions','02','A little input from you','doc','Needs you','gold')}${kpi('Service value',compact(orders.reduce((v,o)=>v+o.amount,0)),'Sample project totals','wallet')}${kpi('Next milestone','28 <span>Oct</span>','Brand direction review','calendar','Coming up','gold')}</div><div class="dashboard-grid"><div class="stack">${panel('Your business, in motion',ordersTable(orders),'<button data-action="route" data-page="projects">All projects ↗</button>','A clear view of every moving part')}${activityPanel()}</div><div class="stack">${actionPanel()}${deadlinePanel()}${booksPromo()}</div></div>`;}
function servicesPage(){let list=services.filter(s=>state.filter==='all'||s.category===state.filter);return head('The right support for your next step.','Explore the expertise behind your business.','','EXPLORE YBS')+`<div class="content-tabs" role="tablist" aria-label="Service categories">${['all',...new Set(services.map(s=>s.category))].map(c=>`<button role="tab" aria-selected="${c===state.filter}" class="${c===state.filter?'active':''}" data-action="filter" data-filter="${c}">${c==='all'?'All services':c}</button>`).join('')}</div><div class="service-grid">${list.map(s=>`<article class="service-card"><span class="square-icon ${s.tone}">${icon(s.icon)}</span><h3>${s.name}</h3><p>${s.desc}</p><div class="service-card-bottom"><span>${s.category}</span><button data-action="service" data-id="${s.id}">Explore service ↗</button></div></article>`).join('')}</div>`;}
function projectCards(orders,provider=false){return `<div class="project-cards">${orders.map(o=>`<article class="project-card"><div class="project-card-top">${serviceIcon(o.service)}${statuses(o.status)}</div><h3>${esc(o.name)}</h3><p>#${o.id} · ${esc(o.client)}</p><div class="row-between"><span>Project progress</span><span>${o.progress}%</span></div><div class="progress-track"><span style="width:${o.progress}%"></span></div><div class="row-between"><span>Next review</span><span>${o.due}</span></div><div class="project-meta"><span><span class="small-avatar">${o.provider===null?'Y':initials(state.providers[o.provider].name)}</span>${o.provider===null?'Your YBS team':esc(state.providers[o.provider].name.split(' ')[0])}</span><button data-action="${provider?'update-task':'project'}" data-id="${o.id}">${provider?'Update progress':'View project'} ↗</button></div></article>`).join('')}</div>`;}
function projectsPage(){return head('Every milestone. One clear view.','Follow the work that’s moving your business forward.',btn('+ New service','new-service'))+projectCards(activeClientOrders());}
function documentsPage(){return head('A home for the details.','Project requirements, shared documents, and deliverables.',btn('+ Add document','upload'))+`<div class="notice blue">${icon('shield')}Design preview: upload adds a filename to this session only. File contents are never sent or stored.</div><div class="file-grid">${state.docs.map((d,i)=>`<article class="file-card">${icon('doc')}<h3>${esc(d.name)}</h3><p>${esc(d.type)} · ${esc(d.size)}</p><div class="row-between">${pill(d.status,d.status==='Ready for review'?'gold':'')}<button class="text-link" data-action="document" data-id="${i}">Details ↗</button></div></article>`).join('')}</div>`;}
function billingPage(){return head('The business side of your services.','Sample service orders and billing records.',btn('Export CSV','export','secondary'))+panel('Your service orders',table(['Reference','Service','Service value','Project status',''],activeClientOrders().map(o=>`<tr><td><strong>#${o.id}</strong></td><td>${esc(o.name)}</td><td><strong>${money(o.amount)}</strong></td><td>${statuses(o.status)}</td><td><button class="table-action" data-action="billing-detail" data-id="${o.id}">View breakdown</button></td></tr>`)))+`<div class="notice gold section-space">${icon('wallet')}Illustrative service values only. These are not issued invoices or confirmed payments.</div>`;}
function adminDashboard(){const unassigned=state.orders.filter(o=>o.provider===null).length;return head('A clear view of the moving parts.','Your team, services, and work in progress.',btn('+ Add provider','add-provider'), 'YBS OPERATIONS')+`<div class="kpis">${kpi('Sample order value',compact(state.orders.reduce((s,o)=>s+o.amount,0)),'Across demo orders','wallet')}${kpi('Active orders',String(state.orders.filter(o=>o.status!=='Done').length).padStart(2,'0'),'Across all clients','brief','Live in preview')}${kpi('Service providers',String(state.providers.length).padStart(2,'0'),'Your professional network','people')}${kpi('Needs assignment',String(unassigned).padStart(2,'0'),'Ready for the right expert','inbox',unassigned?'Action needed':'All clear','gold')}</div><div class="dashboard-grid"><div class="stack">${panel('Revenue at a glance',`<div class="panel-padding"><div class="chart-info"><span>Illustrative revenue<b>${state.chartPeriod==='year'?'₹8.42L':'₹1.84L'}</b></span><span>View<b style="font-size:12px;margin-top:10px">${state.chartPeriod==='year'?'Year to date':'This month'}</b></span></div>${chart()}</div>`,`<button data-action="chart-period">${state.chartPeriod==='month'?'This month':'This year'} ⌄</button>`,'Example trend · not connected to financial records')}${panel('Orders in motion',ordersTable(state.orders.slice(0,4),true),'<button data-action="route" data-page="orders">View all ↗</button>')}</div><div class="stack">${panel('The assignment desk',`<div class="task-list">${state.orders.filter(o=>o.provider===null||o.status==='Pending accept').map(o=>`<div class="action-item"><span class="task-check">${icon('brief')}</span><div><b>${esc(o.name)}</b><p>${esc(o.client)}</p>${statuses(o.status)}</div><button data-action="assign" data-id="${o.id}" aria-label="Assign ${esc(o.name)}">↗</button></div>`).join('')||empty('Everything has an owner.')}</div>`,'','Work waiting for its next step')}${panel('Your people, connected',`<div class="task-list">${state.providers.map(p=>`<div class="action-item"><span class="small-avatar">${initials(p.name)}</span><div><b>${esc(p.name)}</b><p>${esc(p.role)}</p></div>${pill(p.status,p.status==='Busy'?'gold':'')}</div>`).join('')}</div>`,'<button data-action="route" data-page="providers">All providers ↗</button>')}${activityPanel()}</div></div>`;}
function ordersPage(queue=false){const filters=queue?['all','Unassigned','Pending accept','In progress','Rejected']:['all','In progress','Review','Pending accept','Unassigned'];let list=state.orders.filter(o=>(state.filter==='all'||o.status===state.filter)&&`${o.name} ${o.client} ${o.id}`.toLowerCase().includes(state.query.toLowerCase()));return head(queue?'The right work. The right expert.':'Your orders, connected.',queue?'Assign, reassign, and follow every handoff.':'A shared view of client work across YBS.',btn('Export CSV','export','secondary'), 'YBS OPERATIONS')+`<section class="panel"><div class="toolbar"><label class="input-search">${icon('search')}<input data-search="orders" aria-label="Search orders" placeholder="Search client, service, or order…" value="${esc(state.query)}"></label><div class="filters">${filters.map(f=>`<button class="filter-chip ${f===state.filter?'active':''}" data-action="filter" data-filter="${f}">${f==='all'?'All orders':f}</button>`).join('')}</div></div><div id="table-results">${ordersTable(list,true)}</div></section>`;}
function providersPage(){return head('Expertise, with a human face.','Onboard and manage the people delivering your services.',btn('+ Add provider','add-provider'),'YOUR PROFESSIONAL NETWORK')+`<div class="provider-grid">${state.providers.map((p,i)=>`<article class="provider-card"><div class="provider-card-head"><span class="avatar">${initials(p.name)}</span><div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p></div></div><div class="pill-row">${p.tags.map(t=>`<span class="plain-pill">${esc(t)}</span>`).join('')}</div><div class="row-between"><span>${p.id}</span>${pill(p.status,p.status==='Busy'?'gold':'')}</div><div class="provider-divider"></div><div class="row-between"><span>Books access</span><span>${p.books==='off'?'Not granted':p.books==='scoped'?'Own payouts only':'Full access'}</span></div><div class="row-between" style="margin-top:16px"><span>${state.orders.filter(o=>o.provider===i&&o.status!=='Done').length} assigned orders</span><button class="text-link" data-action="provider-detail" data-id="${i}">View profile ↗</button></div></article>`).join('')}</div>`;}
function accessPage(){const rows=state.access.map(u=>({key:u.id,name:u.name,type:u.type,scope:u.scope,detail:u.company})).concat(state.providers.map((p,i)=>({key:'provider-'+i,name:p.name,type:'Provider',scope:p.books,detail:p.id})));return head('Access that fits the role.','Control which people can use Books, and what they can see.','','BOOKS ACCESS CONTROL')+`<div class="notice gold">${icon('shield')}Free-claim launch model · individually granted access. These switches change the preview only, not real permissions.</div>`+panel('People & Books access',table(['Person','Role','Access','Scope'],rows.map(r=>`<tr><td><div class="project-cell"><span class="small-avatar">${initials(r.name)}</span><div><strong>${esc(r.name)}</strong><small>${esc(r.detail)}</small></div></div></td><td>${r.type}</td><td><button class="toggle ${r.scope!=='off'?'on':''}" role="switch" aria-checked="${r.scope!=='off'}" aria-label="Books access for ${esc(r.name)}" data-action="toggle-access" data-id="${r.key}"></button></td><td><select class="inline-select" data-scope="${r.key}" aria-label="Books scope for ${esc(r.name)}" ${r.scope==='off'?'disabled':''}><option value="scoped" ${r.scope==='scoped'?'selected':''}>Scoped · own records</option><option value="full" ${r.scope==='full'?'selected':''}>Full access</option></select></td></tr>`)),'','Super admin remains fully authorized in this preview');}
function providerDashboard(){const pending=state.inbox.filter(t=>t.status==='Pending').length,active=state.orders.filter(o=>o.provider===0&&o.status!=='Done');return head('Good work starts with a clear view.','Ananya, here’s your work and your next priorities.',btn('Open task inbox','route','','data-page="inbox"'),'YOUR PROFESSIONAL WORKSPACE')+`<div class="kpis">${kpi('Tasks in inbox',String(pending).padStart(2,'0'),'New decisions to make','inbox',pending?'Needs you':'All clear','gold')}${kpi('Active orders',String(active.length).padStart(2,'0'),'Moving toward delivery','brief')}${kpi('Accepted tasks',state.inbox.filter(t=>t.status==='Accepted').length,'In this preview session','check')}${kpi('Pending earnings',money(8500),'Sample payout balance','wallet')}</div><div class="dashboard-grid"><div class="stack">${panel('Your next decisions',`<div class="panel-padding">${state.inbox.filter(t=>t.status==='Pending').slice(0,1).map(inboxCard).join('')||empty('Your inbox is clear.')}`+'</div>','<button data-action="route" data-page="inbox">All assignments ↗</button>')}${panel('Your active work',ordersTable(active),'<button data-action="route" data-page="active">Open tasks ↗</button>')}</div><div class="stack">${deadlinePanel()}${panel('Designed around your work',`<div class="panel-padding"><p style="font-size:11px;line-height:1.9">Accept the work you can deliver. Keep progress visible. Track your earnings in one place.</p>${btn('View earnings','route','secondary','data-page="payouts"')}</div>`)}</div></div>`;}
function inboxCard(t){return `<article class="inbox-card"><div class="row-between"><div><span class="task-ref">${t.id}</span><h3>${esc(t.name)}</h3></div><div class="payout">${money(t.payout)}<small>Task payout</small></div></div><div class="inbox-meta"><span>${icon('brief')}${esc(t.client)}</span><span>${icon('calendar')}Due ${t.due}</span><span>${icon('chart')}${t.effort}</span></div><p>${esc(t.brief)}</p><div class="inbox-bottom"><span class="muted" style="font-size:9px">${t.status==='Pending'?'Awaiting your decision':t.status==='Rejected'?'Reason: '+esc(t.reason):'Accepted · added to active tasks'}</span>${t.status==='Pending'?`<div class="stacked-actions">${btn('Decline','reject-task','secondary small',`data-id="${t.id}"`)}${btn('Accept task ↗','accept-task','small',`data-id="${t.id}"`)}</div>`:statuses(t.status)}</div></article>`;}
function inboxPage(){return head('Your next opportunity.','Review each assignment before you pick it up.','','TASK INBOX')+`<div class="notice gold">${icon('inbox')}Assignments require a response within 24 hours. Real escalation would be handled by your production system.</div><div class="content-tabs" role="tablist" aria-label="Assignment status">${['all','Pending','Accepted','Rejected'].map(f=>`<button role="tab" aria-selected="${state.filter===f}" class="${state.filter===f?'active':''}" data-action="filter" data-filter="${f}">${f==='all'?'All assignments':f}</button>`).join('')}</div>${state.inbox.filter(t=>state.filter==='all'||t.status===state.filter).map(inboxCard).join('')||empty('No assignments in this view.')}`;}
function activePage(){const orders=state.orders.filter(o=>o.provider===0&&o.status!=='Done');return head('Keep the progress visible.','Update milestones and share your next handoff.','','ACTIVE TASKS')+projectCards(orders,true);}
function clientScopedBooks(){return head('Your service records, in one place.','Terra Studio · access limited to your own service orders.','','BOOKS / CLIENT SCOPE')+`<div class="notice">${icon('shield')}Scoped client preview: your own service records only. Platform finances and provider earnings are hidden.</div>`+panel('Your service records',table(['Order','Service','Sample value','Status'],activeClientOrders().map(o=>`<tr><td><strong>${o.id}</strong></td><td>${esc(o.name)}</td><td>${money(o.amount)}</td><td>${statuses(o.status)}</td></tr>`)));}
function payoutsPage(scoped=false){return head('Your work, accounted for.','Ananya Sharma · YBS-PRV-0021',btn('Export CSV','export','secondary'),scoped?'BOOKS / SCOPED ACCESS':'EARNINGS & PAYOUTS')+`<div class="kpis">${kpi('Total earned','₹1.84L','Sample lifetime earnings','wallet')}${kpi('This month','₹14,200','Sample October earnings','chart')}${kpi('Pending payout','₹8,500','Before deductions','inbox')}${kpi('Accepted this session',state.inbox.filter(t=>t.status==='Accepted').length,'Session activity only','check')}</div>${scoped?`<div class="notice">${icon('shield')}Scoped access: your own earnings and payout references only. Platform-wide invoices, bills, and reports are hidden.</div>`:''}`+panel('Your payout history',table(['Reference','Period','Gross','TDS','Net paid','Status'],[['YBS-PAY-0021-09-2026','Sep 2026',16400,1640,14760,'Paid'],['YBS-PAY-0021-08-2026','Aug 2026',12000,1200,10800,'Paid']].map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${money(r[2])}</td><td>${money(r[3])}</td><td><strong>${money(r[4])}</strong></td><td>${statuses(r[5])}</td></tr>`)),'','Illustrative payout data; no money moves in this preview');}
function booksDashboard(){const receivables=state.invoices.reduce((s,d)=>s+dueAmount(d),0),payables=state.bills.reduce((s,d)=>s+dueAmount(d),0),receipts=state.transactions.filter(t=>t.type==='Receipt').reduce((s,t)=>s+t.amount,0);return head('Your numbers. A clearer picture.','Demo organisation · FY 2026–27',btn('+ New invoice','invoice-new'),'YBS BOOKS')+`<div class="kpis">${kpi('Invoice value',compact(state.invoices.filter(issued).reduce((s,d)=>s+total(d),0)),'Issued documents · incl. tax','doc')}${kpi('Receivables',compact(receivables),'Uncollected invoice balance','inbox',receivables?'Outstanding':'All clear','gold')}${kpi('Payables',compact(payables),'Approved vendor bills','wallet')}${kpi('Receipts recorded',compact(receipts),'Sample customer collections','chart')}</div><div class="dashboard-grid"><div class="stack">${panel('The flow of your business',`<div class="panel-padding"><div class="chart-info"><span>Document to collection<b style="font-size:15px">Order → Invoice → Receipt</b></span></div>${chart()}<div class="notice blue" style="margin-bottom:0;font-size:9px">Illustrative trend only. The totals above follow your sample transactions.</div></div>`,'','From the first order to the final payment')}${panel('Recent invoices',financialTable(state.invoices,'invoice'),'<button data-action="route" data-page="invoices">All invoices ↗</button>')}</div><div class="stack">${panel('Cash movement',`<div class="panel-padding"><div class="chart-info" style="margin-bottom:18px"><span>Money in<b>${compact(receipts)}</b></span><span>Money out<b>${compact(state.transactions.filter(t=>t.type==='Payment').reduce((s,t)=>s+t.amount,0))}</b></span></div>${state.transactions.slice(-3).reverse().map(t=>`<div class="transaction-row"><span class="square-icon">${icon(t.type==='Receipt'?'inbox':'wallet')}</span><div><b>${esc(t.party)}</b><small>${esc(t.document)}</small></div><strong>${t.type==='Receipt'?'+':'−'}${money(t.amount)}</strong></div>`).join('')}</div>`)}${panel('Connected workflows',`<div class="task-list"><div class="action-item"><span class="task-check">${icon('brief')}</span><div><b>Sales order to receipt</b><p>Capture, invoice, and collect.</p></div><button data-action="route" data-page="sales" aria-label="Open sales orders">↗</button></div><div class="action-item"><span class="task-check">${icon('doc')}</span><div><b>Purchase order to payment</b><p>Request, approve, and pay.</p></div><button data-action="route" data-page="purchases" aria-label="Open purchase orders">↗</button></div></div>`)}</div></div>`;}
function financialTable(docs,type){return table(['Document','Customer / vendor','Total','Balance','Status','Action'],docs.map(d=>`<tr><td><strong>${esc(d.id)}</strong><small>Due ${esc(d.due)}</small></td><td>${esc(d.party)}</td><td>${money(total(d))}</td><td><strong>${money(dueAmount(d))}</strong></td><td>${statuses(d.status)}</td><td><button class="table-action" data-action="financial-detail" data-type="${type}" data-id="${d.id}">View</button></td></tr>`));}
function financialPage(type){const invoice=type==='invoice',docs=invoice?state.invoices:state.bills;const filtered=docs.filter(d=>state.filter==='all'||(state.filter==='Outstanding'?dueAmount(d)>0:d.status===state.filter));return head(invoice?'From your work to your invoice.':'A clear view of what’s payable.',invoice?'Create, issue, and track customer invoices.':'Record vendor bills and allocate your payments.',btn(invoice?'+ New invoice':'+ New bill',invoice?'invoice-new':'bill-new'),'YBS BOOKS')+`<div class="content-tabs" role="tablist" aria-label="Financial document status">${['all','Draft','Outstanding','Paid'].map(f=>`<button role="tab" aria-selected="${f===state.filter}" class="${f===state.filter?'active':''}" data-action="filter" data-filter="${f}">${f==='all'?'All documents':f}</button>`).join('')}</div>`+panel(invoice?'Customer invoices':'Vendor bills',financialTable(filtered,type),'','Amounts include illustrative GST calculations');}
function field(label,name,value='',type='text',extra=''){return `<label class="field ${extra.includes('data-full')?'full':''}"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function selectField(label,name,options,value){return `<label class="field"><span>${label}</span><select name="${name}">${options.map(o=>`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;}
function docPreview(d,type,id='Draft'){const base=Number(d.qty)*Number(d.rate),tax=base*Number(d.tax)/100;return `<div class="document-preview"><div class="doc-header"><span>YBS <span style="font-weight:400">Books</span></span><div><strong>${type==='invoice'?'INVOICE':type==='bill'?'VENDOR BILL':type==='sales'?'SALES ORDER':'PURCHASE ORDER'}</strong>${esc(id)}</div></div><div class="doc-party"><div>${type==='bill'||type==='purchase'?'VENDOR':'BILL TO'}<strong>${esc(d.party)}</strong></div><div>WORKSPACE<strong>Demo organisation</strong></div></div><div class="row-between doc-line"><span>${esc(d.item)}<small style="display:block;margin-top:3px">${d.qty} × ${money(d.rate)}</small></span><strong>${money(base)}</strong></div><div class="doc-totals"><div class="row-between"><span>Taxable value</span><strong>${money(base)}</strong></div>${d.mode==='intra'?`<div class="row-between"><span>CGST ${Number(d.tax)/2}%</span><strong>${money(tax/2)}</strong></div><div class="row-between"><span>SGST ${Number(d.tax)/2}%</span><strong>${money(tax/2)}</strong></div>`:`<div class="row-between"><span>IGST ${d.tax}%</span><strong>${money(tax)}</strong></div>`}<div class="row-between grand"><span>Total</span><strong>${money(base+tax)}</strong></div></div><div class="doc-preview-note">Sample document preview. Not an issued tax document. Production numbering, GST treatment, and ledger postings require validated business rules.</div></div>`;}
function orderPage(purchase=false){const d=purchase?state.purchaseDraft:state.saleDraft;return head(purchase?'The purchase, before the payment.':'Start with a clear sales order.',purchase?'Capture the request. Convert it to a vendor bill.':'Capture the agreement. Convert it to a customer invoice.','','YBS BOOKS / '+(purchase?'PURCHASES':'SALES'))+`<div class="financial-grid"><section class="panel panel-padding"><h3>${purchase?'Purchase':'Sales'} order details</h3><p style="font-size:10px">Illustrative single-line workflow</p><form id="order-form" data-kind="${purchase?'purchase':'sales'}"><div class="form-grid">${field(purchase?'Vendor':'Customer','party',d.party,'text','required maxlength="100"')}${field('Item / service','item',d.item,'text','required maxlength="150"')}${field('Quantity','qty',d.qty,'number','required min="0.01" step="0.01" max="100000"')}${field('Rate (₹)','rate',d.rate,'number','required min="0" step="0.01" max="10000000"')}${selectField('GST rate','tax',[[0,'0%'],[5,'5%'],[12,'12%'],[18,'18%'],[28,'28%']].map(o=>[String(o[0]),o[1]]),String(d.tax))}${selectField('Tax treatment','mode',[['intra','Intra-state · CGST + SGST'],['inter','Inter-state · IGST']],d.mode)}</div><p class="form-note">Orders do not post to the ledger. Conversion creates a draft document for review.</p><div class="form-actions"><button class="button secondary" type="submit" name="intent" value="save">Save order in demo</button><button class="button" type="submit" name="intent" value="convert">Convert to ${purchase?'bill':'invoice'} ↗</button></div></form></section><div id="order-preview">${docPreview(d,purchase?'purchase':'sales')}</div></div>`;}
function paymentsPage(){return head('A little more clarity on cash.','Receipts and payments allocated to their source documents.',btn('Record transaction','transaction'),'YBS BOOKS / PAYMENTS')+panel('Recorded payments',table(['Party','Document','Type','Reference','Amount'],state.transactions.slice().reverse().map(t=>`<tr><td><strong>${esc(t.party)}</strong></td><td>${esc(t.document)}</td><td>${pill(t.type,t.type==='Payment'?'gold':'')}</td><td>${esc(t.reference)}</td><td><strong>${money(t.amount)}</strong></td></tr>`)),'','Sample allocations only · no payment gateway or bank connection');}
function reportsPage(){const reports=[['Profit & loss','Revenue and costs from posted sample documents.','chart','profit'],['Receivables aging','Open customer balances grouped by due status.','inbox','receivables'],['Payables summary','Unpaid approved vendor documents.','wallet','payables'],['GST working','Illustrative output and input tax totals.','doc','tax'],['Sales register','Invoice details and document values.','brief','sales'],['Purchase register','Bill details and recorded purchases.','book','purchases']];return head('The view behind the numbers.','Explore sample financial reports and registers.','','YBS BOOKS / REPORTS')+`<div class="notice blue">${icon('chart')}Reports derive from this preview’s document state. They are not a validated general ledger or tax return.</div><div class="report-grid">${reports.map(r=>`<article class="report-card"><span class="square-icon">${icon(r[2])}</span><h3>${r[0]}</h3><p>${r[1]}</p><button data-action="report" data-id="${r[3]}">Open sample report ↗</button></article>`).join('')}</div>`;}
function profilePage(){const r=roles[state.portal],p=state.portal==='client'?state.profile:state.roleProfiles?.[state.portal]||{name:r.person,email:'team@example.test',company:r.org,phone:'',state:'Andhra Pradesh'};return head('A few details, all in one place.','Keep your workspace profile up to date.','','YOUR PROFILE')+`<div class="profile-layout"><section class="panel profile-summary"><span class="avatar">${initials(r.person)}</span><div><h3>${state.portal==='client'?esc(state.profile.name):r.person}</h3><p>${r.role}</p></div>${pill('Demo profile')}</section><section class="panel panel-padding"><h3>Workspace details</h3><p style="font-size:10px;margin-bottom:24px">Changes are held only in this browser session.</p><form id="profile-form"><div class="form-grid">${field('Full name','name',p.name,'text','required maxlength="100"')}${field('Email address','email',p.email,'email','required')}${field('Business / organisation','company',p.company,'text','required maxlength="100"')}${field('Mobile (optional)','phone',p.phone,'tel','maxlength="20"')}${selectField('State','state',[['Andhra Pradesh','Andhra Pradesh'],['Telangana','Telangana'],['Karnataka','Karnataka'],['Maharashtra','Maharashtra']],state.profile.state)}</div><div class="form-actions"><button class="button" type="submit">Save demo profile</button></div></form></section></div>`;}
function readRoute(){const parts=location.hash.replace(/^#/,'').split('/');if(roles[parts[0]]){state.portal=parts[0];state.page=parts[1]||'dashboard';}else{state.portal='client';state.page='dashboard';}state.filter='all';state.query='';render();window.scrollTo(0,0);}
function route(page,portal=state.portal){if(state.portal===portal&&state.page===page){state.filter='all';state.query='';render();return;}location.hash=portal+'/'+page;}
function render(){
 const scope=currentScope(),r=state.portal==='books'&&state.bookContext!=='finance'?{...roles.books,person:state.bookContext==='provider'?'Ananya Sharma':state.profile.name,role:scope==='off'?'No Books access':scope==='scoped'?'Scoped Books access':'Full Books access'}:roles[state.portal];
 $('#portal-switch').innerHTML=Object.entries(roles).map(([key,r])=>`<button class="portal-button ${state.portal===key?'active':''}" data-action="portal" data-portal="${key}" aria-pressed="${state.portal===key}">${icon(r.icon)}${r.name}</button>`).join('');
 $('#org-initials').textContent=initials(r.org);$('#org-name').textContent=r.org;$('#org-type').textContent=state.portal==='books'?`${state.bookContext==='finance'?'Finance admin':state.bookContext==='provider'?'Ananya Sharma':'Terra Studio'} · ${scope==='full'?'Full access':scope==='scoped'?'Own records':'No access'}`:r.orgType;
 $('#account-name').textContent=state.portal==='client'?state.profile.name:r.person;$('#account-role').textContent=r.role;$('#account-avatar').textContent=initials(r.person);$('.top-avatar').textContent=initials(r.person);$('#breadcrumb-role').textContent=r.title;
 let nav=state.portal==='books'&&scope==='scoped'?[['SCOPED BOOKS','dashboard','My payouts','wallet']]:navigation[state.portal];
 if(state.portal==='books'&&scope==='off')nav=[];
 $('#side-nav').innerHTML=nav.map(([group,page,name,ico])=>`${group?`<div class="nav-label">${group}</div>`:''}<button class="nav-item ${state.page===page?'active':''}" data-action="route" data-page="${page}">${icon(ico)}${name}${page==='inbox'?`<span class="nav-badge">${state.inbox.filter(t=>t.status==='Pending').length}</span>`:page==='projects'?`<span class="nav-badge">${activeClientOrders().length}</span>`:''}</button>`).join('');
 if(state.portal==='client'&&state.access[0].scope!=='off'||state.portal==='provider'&&state.providers[0].books!=='off'||state.portal==='admin')$('#side-nav').insertAdjacentHTML('beforeend',`<div class="nav-label">CONNECTED TOOLS</div><button class="nav-item" data-action="open-books">${icon('book')}YBS Books <span class="nav-badge">↗</span></button>`);
 if(state.portal==='books')$('#side-nav').insertAdjacentHTML('beforeend',`<div class="nav-label">PREVIEW CONTEXT</div><label class="field" style="padding:0 10px"><span style="font-size:8px;color:#8da79e">View Books as</span><select id="books-context" style="background:#203b45;border-color:#38515b;color:#b9ccbb;font-size:9px;padding:7px;min-height:33px"><option value="finance" ${state.bookContext==='finance'?'selected':''}>Finance admin</option><option value="provider" ${state.bookContext==='provider'?'selected':''}>Provider · Ananya</option><option value="client" ${state.bookContext==='client'?'selected':''}>Client · Terra Studio</option></select></label>`);
 $('#breadcrumb-page').textContent=nav.find(n=>n[1]===state.page)?.[2]||'Overview';
 let html='';
 if(state.portal==='client'){html=({dashboard:clientDashboard,services:servicesPage,projects:projectsPage,documents:documentsPage,billing:billingPage,profile:profilePage}[state.page]||clientDashboard)();}
 if(state.portal==='admin'){html=({dashboard:adminDashboard,orders:()=>ordersPage(),queue:()=>ordersPage(true),providers:providersPage,access:accessPage,profile:profilePage}[state.page]||adminDashboard)();}
 if(state.portal==='provider'){html=({dashboard:providerDashboard,inbox:inboxPage,active:activePage,payouts:payoutsPage,profile:profilePage}[state.page]||providerDashboard)();}
 if(state.portal==='books'){html=scope==='off'?head('Books access has not been granted.','Ask your YBS administrator to enable this module.')+`<div class="notice gold">${icon('shield')}The selected demo user has no Books access. Switch to Admin → Books access to change the preview.</div>`:scope==='scoped'?(state.bookContext==='provider'?payoutsPage(true):clientScopedBooks()):({dashboard:booksDashboard,invoices:()=>financialPage('invoice'),bills:()=>financialPage('bill'),sales:()=>orderPage(),purchases:()=>orderPage(true),payments:paymentsPage,reports:reportsPage,profile:profilePage}[state.page]||booksDashboard)();}
 $('#main').innerHTML=html;document.body.classList.remove('menu-open');syncMenu();document.title=`YBS — ${r.name} · ${$('#breadcrumb-page').textContent}`;
}
let lastFocus;
function modal(title,body,eyebrow='YBS / DESIGN PREVIEW'){lastFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-eyebrow').textContent=eyebrow;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal();}
function closeModal(){$('#dialog').close();}
$('#dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),4200);}
function log(title,detail,ico='check'){state.activity.unshift({title,detail,time:'Just now',icon:ico});}
function projectModal(id){const o=state.orders.find(o=>o.id===id);if(!o)return;const brand=o.service==='brand';modal(o.name,`<div class="row-between"><span class="muted" style="font-size:10px">#${o.id} · ${esc(o.client)}</span>${statuses(o.status)}</div><div class="timeline">${(brand?['Brief confirmed','Creative direction','First concept shared','Client review','Final deliverables']:['Requirements confirmed','Documents reviewed','Specialist processing','Review & verification','Final handover']).map((t,i)=>`<div class="timeline-step ${i<Math.floor(o.progress/20)?'done':''}"><strong>${t}</strong><small>${i<Math.floor(o.progress/20)?'Completed in the sample workflow':i===Math.floor(o.progress/20)?'Current stage':'Upcoming'}</small></div>`).join('')}</div><div class="notice">${icon('people')}${o.provider===null?'Your YBS team will assign an expert.':esc(state.providers[o.provider].name)+' is coordinating this work.'}</div>${o.status==='Review'?`<div class="form-actions">${btn('Request a revision','revision','secondary',`data-id="${o.id}"`)}${btn('Approve demo deliverable','approve-deliverable','',`data-id="${o.id}"`)}</div>`:''}`,'PROJECT / '+o.id);}
function serviceModal(id){const s=services.find(s=>s.id===id);modal(s.name,`<p>${s.desc}</p><div class="timeline">${s.items.map((x,i)=>`<div class="timeline-step"><strong>${i+1}. ${x}</strong><small>Scope and timeline confirmed after review.</small></div>`).join('')}</div><form id="request-form" data-service="${s.id}"><label class="field"><span>What would you like help with?</span><textarea name="brief" required maxlength="1000" placeholder="A short description of your business and requirements…"></textarea></label><div class="form-actions"><button class="button" type="submit">Create sample request ↗</button></div><p class="form-note">No checkout or charge. This adds a request only to the demo session.</p></form>`,'EXPLORE SERVICES / '+s.category.toUpperCase());}
function assignModal(id){const o=state.orders.find(o=>o.id===id);modal('A clear handoff.',`<p>${esc(o.name)} · ${esc(o.client)} · #${o.id}</p><form id="assign-form" data-id="${o.id}"><div class="form-grid">${selectField('Assigned provider','provider',state.providers.map((p,i)=>[String(i),p.name+' · '+p.code]),String(o.provider??0))}${field('Review / due date label','due',o.due,'text','required maxlength="30"')}</div><p class="form-note">Assignments become Pending accept. No email or live notification is sent.</p><div class="form-actions"><button class="button" type="submit">Assign in preview ↗</button></div></form>`,'TASK DESK / '+o.id);}
function providerModal(i){const p=state.providers[i];modal(p.name,`<div class="row-between"><span class="muted" style="font-size:11px">${p.id} · ${esc(p.role)}</span>${pill(p.status,p.status==='Busy'?'gold':'')}</div><div class="pill-row section-space">${p.tags.map(t=>`<span class="plain-pill">${esc(t)}</span>`).join('')}</div><div class="metric-mini"><div><small>Assigned orders</small><strong>${state.orders.filter(o=>o.provider===i).length}</strong></div><div><small>Books access</small><strong style="font-size:13px">${p.books==='off'?'Not granted':p.books==='full'?'Full':'Scoped'}</strong></div><div><small>Role code</small><strong>${p.code}</strong></div></div><p>Sample professional record · ${esc(p.email)}</p>${btn('Manage Books permissions','go-access','secondary')}`,'PROVIDER PROFILE');}
function financialModal(type,id){const docs=type==='invoice'?state.invoices:state.bills,d=docs.find(d=>d.id===id);modal(d.id,docPreview(d,type,id)+`<div class="row-between section-space"><span class="muted" style="font-size:10px">Recorded ${type==='invoice'?'receipts':'payments'}: ${money(d.paid)}</span>${statuses(d.status)}</div><div class="form-actions">${btn('Download sample CSV','doc-export','secondary',`data-type="${type}" data-id="${d.id}"`)}${!issued(d)?btn(type==='invoice'?'Issue in demo':'Approve in demo','issue-document','',`data-type="${type}" data-id="${id}"`):dueAmount(d)>0?btn(type==='invoice'?'Record receipt':'Record payment','payment-for','',`data-type="${type}" data-id="${id}"`):''}</div>`,'BOOKS / SAMPLE DOCUMENT');}
function newFinancialModal(type,seed){const d=seed||{party:type==='invoice'?'Coastal Studio LLP':'Pixel Works Pvt Ltd',item:'Professional services',qty:1,rate:5000,tax:18,mode:'intra'};modal(type==='invoice'?'Create a customer invoice.':'Record a vendor bill.',`<form id="financial-form" data-type="${type}"><div class="form-grid">${field(type==='invoice'?'Customer':'Vendor','party',d.party,'text','required maxlength="100"')}${field('Item / service','item',d.item,'text','required maxlength="150"')}${field('Quantity','qty',d.qty,'number','required min="0.01" max="100000" step="0.01"')}${field('Rate (₹)','rate',d.rate,'number','required min="0.01" max="10000000" step="0.01"')}${selectField('GST rate','tax',[['0','0%'],['5','5%'],['12','12%'],['18','18%'],['28','28%']],String(d.tax))}${selectField('Tax treatment','mode',[['intra','Intra-state · CGST + SGST'],['inter','Inter-state · IGST']],d.mode)}${field('Due date','due','2026-10-31','date','required')}</div><p class="form-note">Creates a draft in demo memory only. Issue or approve the document before allocating a payment.</p><div class="form-actions"><button class="button" type="submit">Save sample draft ↗</button></div></form>`,'YBS BOOKS / NEW DOCUMENT');}
function paymentModal(type,id){const docs=type==='invoice'?state.invoices:state.bills,d=docs.find(d=>d.id===id);if(!issued(d))return toast('Issue the invoice or approve the bill first.');const due=dueAmount(d);modal(type==='invoice'?'Record a customer receipt.':'Record a vendor payment.',`<div class="notice">${icon('wallet')}${esc(d.id)} · Balance ${money(due)}</div><form id="payment-form" data-type="${type}" data-id="${id}"><div class="form-grid">${field('Amount (₹)','amount',due,'number',`required min="0.01" max="${due}" step="0.01"`)}${field('Reference','reference','DEMO-UTR-'+String(state.transactions.length+1).padStart(3,'0'),'text','required maxlength="100"')}</div><p class="form-note">Allocation changes the preview balance. No funds are transferred.</p><div class="form-actions"><button class="button" type="submit">Record in demo</button></div></form>`,'PAYMENT ALLOCATION / SAMPLE');}
function exportCSV(rows,name){if(!rows.length)return toast('No records to export.');const keys=Object.keys(rows[0]),quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[keys.map(quote).join(','),...rows.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sample CSV downloaded.');}
function exportCurrent(){if(state.portal==='books'&&currentScope()==='scoped'&&state.bookContext==='provider'||state.portal==='provider'){exportCSV([{Provider:'Ananya Sharma',Reference:'YBS-PAY-0021-09-2026',Gross:16400,TDS:1640,Net:14760}], 'YBS-Sample-Payouts.csv');return;}if(state.portal==='books'&&currentScope()==='scoped'&&state.bookContext==='client'){exportCSV(activeClientOrders().map(o=>({Order:o.id,Service:o.name,SampleValue:o.amount,Status:o.status})),'YBS-Client-Service-Records.csv');return;}if(state.portal==='books'){exportCSV((state.page==='bills'?state.bills:state.invoices).map(d=>({Document:d.id,Party:d.party,Status:d.status,Total:total(d),Paid:d.paid,Balance:dueAmount(d)})),'YBS-Sample-Documents.csv');return;}exportCSV((state.portal==='admin'?state.orders:activeClientOrders()).map(o=>({Order:o.id,Service:o.name,Client:o.client,Status:o.status,Progress:o.progress,SampleValue:o.amount})),'YBS-Sample-Orders.csv');}
function reportModal(id){const invoiceBase=state.invoices.filter(issued).reduce((s,d)=>s+d.qty*d.rate,0),billBase=state.bills.filter(issued).reduce((s,d)=>s+d.qty*d.rate,0);let title='',rows=[];
 if(id==='profit'){title='Sample profit & loss';rows=[{Line:'Sales (excluding tax)',Value:invoiceBase},{Line:'Costs (excluding tax)',Value:billBase},{Line:'Illustrative gross difference',Value:invoiceBase-billBase}];}
 if(id==='tax'){title='Sample GST working';rows=[{Line:'Output tax on issued invoices',Value:state.invoices.filter(issued).reduce((s,d)=>s+d.qty*d.rate*d.tax/100,0)},{Line:'Input tax on approved bills',Value:state.bills.filter(issued).reduce((s,d)=>s+d.qty*d.rate*d.tax/100,0)}];}
 if(['receivables','payables'].includes(id)){title=id==='receivables'?'Receivables summary':'Payables summary';rows=(id==='receivables'?state.invoices:state.bills).filter(d=>dueAmount(d)>0).map(d=>({Document:d.id,Party:d.party,Balance:dueAmount(d)}));}
 if(['sales','purchases'].includes(id)){title=id==='sales'?'Sales register':'Purchase register';rows=(id==='sales'?state.invoices:state.bills).map(d=>({Document:d.id,Party:d.party,Status:d.status,Total:total(d)}));}
 if(!rows.length){modal(title,empty('No open balances in this sample.'));return;}
 const headers=Object.keys(rows[0]);modal(title,`<div class="notice gold">${icon('chart')}Illustrative document-based working. Not a statutory report or validated ledger.</div>`+table(headers,rows.map(r=>`<tr>${headers.map(k=>`<td>${typeof r[k]==='number'?money(r[k]):esc(r[k])}</td>`).join('')}</tr>`))+`<div class="form-actions">${btn('Download sample report','report-export','secondary',`data-id="${id}"`)}</div>`,'YBS BOOKS / REPORT PREVIEW');state.lastReport={rows,title};}
function searchResults(query){const entries=navigation[state.portal].map(n=>({title:n[2],detail:roles[state.portal].title,page:n[1],icon:n[3]}));if(state.portal==='client')services.forEach(s=>entries.push({title:s.name,detail:s.category,action:'service',id:s.id,icon:s.icon}));if(['client','admin','provider'].includes(state.portal))(state.portal==='client'?activeClientOrders():state.portal==='provider'?state.orders.filter(o=>o.provider===0):state.orders).forEach(o=>entries.push({title:o.name,detail:o.id,action:state.portal==='admin'?'assign':'project',id:o.id,icon:'brief'}));const list=entries.filter(x=>`${x.title} ${x.detail}`.toLowerCase().includes(query.toLowerCase()));return list.map(x=>`<button class="search-result" data-action="search-go" data-page="${x.page||''}" data-next="${x.action||''}" data-id="${x.id||''}"><span class="square-icon">${icon(x.icon)}</span><span><strong>${esc(x.title)}</strong><small>${esc(x.detail)}</small></span><span>↗</span></button>`).join('')||empty('No results. Try a service or page name.','search');}
function action(name,el){const id=el?.dataset.id;
 if(name==='portal'){state.bookContext='finance';route('dashboard',el.dataset.portal);return;}
 if(name==='route'){route(el.dataset.page);return;}
 if(name==='filter'){state.filter=el.dataset.filter;render();return;}
 if(name==='reset'){location.reload();return;}
 if(name==='menu'){document.body.classList.toggle('menu-open');syncMenu();return;}
 if(name==='close-menu'){document.body.classList.remove('menu-open');syncMenu();return;}
 if(name==='close-dialog'){closeModal();return;}
 if(name==='profile'){route('profile');return;}
 if(name==='new-service'){route('services','client');return;}
 if(name==='service'){serviceModal(id);return;}
 if(name==='project'){projectModal(id);return;}
 if(name==='support'){modal('Your team is a step away.',`<p>In the live product, this space can connect each client to their assigned YBS team.</p><div class="notice blue">${icon('people')}This is a messaging layout preview. No message will be sent.</div><label class="field"><span>Sample message</span><textarea id="support-text" maxlength="1000" placeholder="What would you like help with?"></textarea></label><div class="form-actions">${btn('Preview message','support-preview')}</div>`,'YOUR YBS TEAM');return;}
 if(name==='support-preview'){const text=$('#support-text').value.trim();if(!text)return toast('Write a short sample message first.');modal('Message preview',`<p style="background:#edf2e7;padding:20px;border-radius:7px;white-space:pre-wrap">${esc(text)}</p><div class="notice">${icon('check')}Preview only. Nothing was sent to your team.</div>`);return;}
 if(name==='notifications'){modal('A little progress, every day.',`<div class="activity">${state.activity.slice(0,6).map(a=>`<div class="activity-row"><span class="activity-dot">${icon(a.icon)}</span><div><p><strong>${esc(a.title)}</strong></p><small>${esc(a.detail)}</small></div><time>${esc(a.time)}</time></div>`).join('')}</div>`,'WORKSPACE UPDATES / SAMPLE');return;}
 if(name==='search'){modal('Find your next step.',`<label class="field"><span>Search this workspace</span><input id="global-search" type="search" placeholder="Search services, projects, or pages…" autocomplete="off"></label><div class="search-results" id="search-results">${searchResults('')}</div>`,'QUICK FIND');$('#global-search').focus();return;}
 if(name==='search-go'){closeModal();if(el.dataset.page)route(el.dataset.page);else action(el.dataset.next,el);return;}
 if(name==='upload'){modal('Add a document.',`<form id="upload-form"><label class="field"><span>Choose a sample file</span><input class="file-input" type="file" name="document" required accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.csv"></label><p class="form-note">Only the filename and size will appear in this preview. Contents are not read, uploaded, or stored.</p><div class="form-actions"><button class="button" type="submit">Add to demo documents</button></div></form>`,'DOCUMENT WORKSPACE');return;}
 if(name==='document'){const d=state.docs[Number(id)];modal(d.name,`<div class="notice">${icon('doc')}${esc(d.type)} · ${esc(d.size)}</div><p>Sample document metadata. No file contents are stored in this interface preview.</p>${pill(d.status)}`,'DOCUMENT DETAILS');return;}
 if(name==='approve-deliverable'){const o=state.orders.find(o=>o.id===id);o.status='Done';o.progress=100;log('Brand deliverable approved','The sample project is now complete.','check');closeModal();render();toast('Sample deliverable approved. Project completed.');return;}
 if(name==='revision'){const o=state.orders.find(o=>o.id===id);o.status='In progress';o.progress=75;log('Revision requested','The design project is back in progress.','design');closeModal();render();toast('Revision state updated in the preview. No message was sent.');return;}
 if(name==='billing-detail'){const o=state.orders.find(o=>o.id===id);modal('Service order breakdown',`<div class="notice">${icon('brief')}#${o.id} · ${esc(o.name)}</div><div class="doc-totals"><div class="row-between"><span>Sample service value</span><strong>${money(o.amount)}</strong></div><div class="row-between"><span>Project status</span>${statuses(o.status)}</div></div><p>Final invoice amount, tax treatment, and payment status must come from the live billing system. This preview does not infer payment from project status.</p>`);return;}
 if(name==='assign'){assignModal(id);return;}
 if(name==='provider-detail'){providerModal(Number(id));return;}
 if(name==='go-access'){closeModal();route('access','admin');return;}
 if(name==='add-provider'){modal('Add expertise to your network.',`<form id="provider-form"><div class="form-grid">${field('Full name','name','','text','required maxlength="100"')}${field('Email','email','','email','required')}${selectField('Professional role','role',[['CA','Chartered accountant'],['CS','Company secretary'],['DEV','Developer'],['DES','Designer'],['MKT','Digital marketer'],['HR','HR specialist'],['LEG','Legal consultant'],['FSS','FSSAI agent'],['ISO','ISO consultant']],'CA')}${field('Specialisation','speciality','','text','required maxlength="100"')}</div><p class="form-note">Adds a sample provider record only. Books defaults to off. No invitation or credential is created.</p><div class="form-actions"><button class="button" type="submit">Add demo provider ↗</button></div></form>`,'PROVIDER ONBOARDING');return;}
 if(name==='toggle-access'){let obj=id.startsWith('provider-')?state.providers[Number(id.split('-')[1])]:state.access.find(u=>u.id===id);let key=id.startsWith('provider-')?'books':'scope';obj[key]=obj[key]==='off'?'scoped':'off';render();toast('Books access changed in the preview only.');return;}
 if(name==='open-books'){state.bookContext=state.portal==='provider'?'provider':state.portal==='client'?'client':'finance';route('dashboard','books');return;}
 if(name==='books-info'){modal('Books is part of the bigger picture.',`<p>YBS Books is intended to fit into the YBS platform. Access is granted individually by an administrator during the launch phase.</p><div class="notice gold">${icon('shield')}The current preview user has no access. Switch to Admin → Books access to explore the control.</div>`);return;}
 if(name==='chart-period'){state.chartPeriod=state.chartPeriod==='month'?'year':'month';render();return;}
 if(name==='accept-task'){const t=state.inbox.find(t=>t.id===id);if(t?.status!=='Pending')return;modal('Ready to take this forward?',`<p>${esc(t.name)} · ${t.id}</p><div class="metric-mini"><div><small>Deadline</small><strong style="font-size:15px">${t.due}</strong></div><div><small>Sample payout</small><strong>${money(t.payout)}</strong></div><div><small>Effort</small><strong style="font-size:15px">${t.effort}</strong></div></div><p>This accepts the assignment in the preview and adds it to your active work.</p><div class="form-actions">${btn('Keep reviewing','close-dialog','secondary')}${btn('Accept in preview','confirm-accept','',`data-id="${t.id}"`)}</div>`,'ASSIGNMENT DECISION');return;}
 if(name==='confirm-accept'){const t=state.inbox.find(t=>t.id===id);if(t?.status!=='Pending')return;t.status='Accepted';if(t.order){const assigned=state.orders.find(o=>o.id===t.order);assigned.status='In progress';assigned.provider=0;}else state.orders.push({id:'YBS-'+(1043+state.orders.length),name:t.name,client:t.client,service:'gst',status:'In progress',progress:0,provider:0,due:t.due,amount:t.payout});log('Assignment accepted',t.name+' was added to active work.','brief');closeModal();render();toast('Task accepted in the preview.');return;}
 if(name==='reject-task'){modal('Make the handoff clear.',`<form id="reject-form" data-id="${id}">${selectField('Reason for declining','reason',[['Capacity full','Capacity full'],['Outside expertise','Outside my expertise'],['Schedule conflict','Schedule conflict'],['Conflict of interest','Conflict of interest'],['Other','Other']],'Capacity full')}<label class="field" style="margin-top:16px"><span>Additional note (optional)</span><textarea name="note" maxlength="500"></textarea></label><p class="form-note">The task returns to the sample admin queue for reassignment.</p><div class="form-actions"><button class="button danger" type="submit">Decline in preview</button></div></form>`,'ASSIGNMENT DECISION');return;}
 if(name==='update-task'){const o=state.orders.find(o=>o.id===id);modal('Keep your next milestone visible.',`<p>${esc(o.name)} · ${esc(o.client)}</p><form id="progress-form" data-id="${id}"><label class="field"><span>Progress <b id="progress-output">${o.progress}%</b></span><input class="progress-editor" type="range" name="progress" min="0" max="100" step="5" value="${o.progress}" aria-label="Project progress"></label><label class="field" style="margin-top:15px"><span>Progress note</span><textarea name="note" required maxlength="500" placeholder="What has moved forward?"></textarea></label><p class="form-note">100% submits for review; it does not automatically approve client delivery.</p><div class="form-actions"><button class="button" type="submit">Update sample progress</button></div></form>`,'ACTIVE WORK');return;}
 if(name==='invoice-new'||name==='bill-new'){newFinancialModal(name==='invoice-new'?'invoice':'bill');return;}
 if(name==='financial-detail'){financialModal(el.dataset.type,id);return;}
 if(name==='issue-document'){const type=el.dataset.type,d=(type==='invoice'?state.invoices:state.bills).find(d=>d.id===id);if(!issued(d)){d.status=type==='invoice'?'Issued':'Approved';log(type==='invoice'?'Sample invoice issued':'Sample bill approved',d.id,'doc');}render();financialModal(type,id);toast('Document state updated in demo memory.');return;}
 if(name==='payment-for'){paymentModal(el.dataset.type,id);return;}
 if(name==='transaction'){const open=state.invoices.filter(d=>dueAmount(d)>0).map(d=>['invoice',d]).concat(state.bills.filter(d=>dueAmount(d)>0).map(d=>['bill',d]));modal('Choose a document to allocate against.',open.length?`<div class="search-results">${open.map(([t,d])=>`<button class="search-result" data-action="payment-for" data-type="${t}" data-id="${d.id}"><span class="square-icon">${icon(t==='invoice'?'inbox':'wallet')}</span><span><strong>${esc(d.party)}</strong><small>${d.id} · ${t==='invoice'?'Receipt':'Payment'}</small></span><span>${money(dueAmount(d))} ↗</span></button>`).join('')}</div>`:empty('All sample balances are settled.'),'BOOKS / RECORD TRANSACTION');return;}
 if(name==='export'){exportCurrent();return;}
 if(name==='doc-export'){const d=(el.dataset.type==='invoice'?state.invoices:state.bills).find(d=>d.id===id);exportCSV([{Document:d.id,Party:d.party,Item:d.item,Quantity:d.qty,Rate:d.rate,GST:d.tax,Total:total(d),Status:d.status}],'YBS-'+d.id+'-Sample.csv');return;}
 if(name==='report'){reportModal(id);return;}
 if(name==='report-export'){exportCSV(state.lastReport.rows,'YBS-Sample-'+id+'.csv');return;}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el.dataset.action,el);});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='global-search')$('#search-results').innerHTML=searchResults(el.value);if(el.name==='progress'&&$('#progress-output'))$('#progress-output').textContent=el.value+'%';if(el.dataset.search==='orders'){state.query=el.value;let list=state.orders.filter(o=>(state.filter==='all'||o.status===state.filter)&&`${o.name} ${o.client} ${o.id}`.toLowerCase().includes(state.query.toLowerCase()));$('#table-results').innerHTML=ordersTable(list,true);}if(el.closest('#order-form')){const f=el.closest('form'),d=Object.fromEntries(new FormData(f));$('#order-preview').innerHTML=docPreview(d,f.dataset.kind);}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='books-context'){state.bookContext=el.value;state.page='dashboard';if(location.hash!=='#books/dashboard')location.hash='books/dashboard';else render();}if(el.dataset.scope){const id=el.dataset.scope;const obj=id.startsWith('provider-')?state.providers[Number(id.split('-')[1])]:state.access.find(u=>u.id===id);obj[id.startsWith('provider-')?'books':'scope']=el.value;toast('Preview scope updated. This is not a real permission change.');}});
document.addEventListener('submit',e=>{const form=e.target;if(!(form instanceof HTMLFormElement))return;e.preventDefault();const data=Object.fromEntries(new FormData(form));
 if(form.id==='request-form'){const s=services.find(s=>s.id===form.dataset.service);const o={id:'YBS-'+(1043+state.orders.length),name:s.name,client:'Terra Studio',service:s.id,status:'Unassigned',progress:0,provider:null,due:'To confirm',amount:0};state.orders.push(o);log('A new service request is ready',s.name+' has been added to the sample queue.','brief');closeModal();route('projects','client');toast('Sample request created. No payment or message was sent.');}
 if(form.id==='provider-form'){const code=data.role;const role=form.elements.role.selectedOptions[0].text;state.providers.push({id:'YBS-PRV-'+String(21+state.providers.length).padStart(4,'0'),name:data.name,role,code,status:'Available',books:'off',tasks:0,email:data.email,tags:[data.speciality]});closeModal();render();toast('Demo provider added. No invitation was sent.');}
 if(form.id==='assign-form'){const o=state.orders.find(o=>o.id===form.dataset.id);o.provider=Number(data.provider);o.status='Pending accept';o.due=data.due;log('Provider assigned',o.name+' → '+state.providers[o.provider].name,'people');if(o.provider===0&&!state.inbox.some(t=>t.order===o.id&&t.status==='Pending'))state.inbox.push({id:'PRV-CA-2026-'+String(53+state.inbox.length).padStart(4,'0'),order:o.id,name:o.name,client:o.client,brief:'Review this sample client assignment and confirm whether you can deliver it.',payout:2500,due:o.due,effort:'To confirm',status:'Pending',reason:''});closeModal();render();toast('Provider assigned in the preview. No notification sent.');}
 if(form.id==='reject-form'){const t=state.inbox.find(t=>t.id===form.dataset.id);if(t?.status!=='Pending')return;t.status='Rejected';t.reason=data.reason;if(t.order){const o=state.orders.find(o=>o.id===t.order);o.provider=null;o.status='Rejected';}else state.orders.push({id:'YBS-'+(1043+state.orders.length),name:t.name,client:t.client,service:'gst',status:'Rejected',progress:0,provider:null,due:t.due,amount:t.payout});log('Assignment returned to queue',t.name+' · '+data.reason,'inbox');closeModal();render();toast('Task declined in the preview and returned to the admin queue.');}
 if(form.id==='progress-form'){const o=state.orders.find(o=>o.id===form.dataset.id);o.progress=Number(data.progress);o.status=o.progress===100?'Review':'In progress';log('Progress updated',o.name+' · '+o.progress+'% · '+data.note,'chart');closeModal();render();toast('Sample progress updated.');}
 if(form.id==='profile-form'){if(state.portal==='client')Object.assign(state.profile,data);else{state.roleProfiles=state.roleProfiles||{};state.roleProfiles[state.portal]=data;roles[state.portal].person=data.name;roles[state.portal].org=data.company;}render();toast('Demo profile saved for this session only.');}
 if(form.id==='upload-form'){const file=form.elements.document.files[0];if(!file)return;state.docs.push({name:file.name,type:'Session document',size:file.size>=1048576?(file.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB',status:'Added in preview'});log('Document metadata added',file.name+' · no file content uploaded','doc');closeModal();route('documents','client');render();toast('Filename added. No contents were read or uploaded.');}
 if(form.id==='order-form'){const key=form.dataset.kind==='sales'?'saleDraft':'purchaseDraft';state[key]={...data,qty:Number(data.qty),rate:Number(data.rate),tax:Number(data.tax)};if(e.submitter?.value==='convert')newFinancialModal(form.dataset.kind==='sales'?'invoice':'bill',state[key]);else toast('Sample order saved for this session. No ledger posting.');}
 if(form.id==='financial-form'){const type=form.dataset.type,docs=type==='invoice'?state.invoices:state.bills;const next=Math.max(...docs.map(d=>Number(d.id.split('-').pop())),0)+1;const id=(type==='invoice'?'INV':'BILL')+'-2026-'+String(next).padStart(3,'0');docs.push({...data,id,qty:Number(data.qty),rate:Number(data.rate),tax:Number(data.tax),paid:0,status:'Draft'});closeModal();state.page=type==='invoice'?'invoices':'bills';location.hash='books/'+state.page;render();financialModal(type,id);toast('Sample draft created.');}
 if(form.id==='payment-form'){const type=form.dataset.type,d=(type==='invoice'?state.invoices:state.bills).find(d=>d.id===form.dataset.id);const amount=Number(data.amount);if(!issued(d)||!Number.isFinite(amount)||amount<=0||amount>dueAmount(d)+.001)return toast('Enter a positive amount within the open balance.');d.paid=Math.round((d.paid+amount)*100)/100;d.status=dueAmount(d)<.005?'Paid':'Partially paid';state.transactions.push({party:d.party,document:d.id,amount,type:type==='invoice'?'Receipt':'Payment',reference:data.reference});closeModal();render();toast('Sample allocation recorded. No money was transferred.');}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();action('search');}});
function syncMenu(){const open=document.body.classList.contains('menu-open');const mobile=window.matchMedia('(max-width:760px)').matches;document.getElementById('sidebar').inert=mobile&&!open;const menu=document.querySelector('[data-action=menu]');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Close menu':'Open menu');}window.matchMedia('(max-width:760px)').addEventListener('change',syncMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open')){document.body.classList.remove('menu-open');syncMenu();document.querySelector('[data-action=menu]').focus();}});window.addEventListener('hashchange',readRoute);readRoute();
</script></body></html>
